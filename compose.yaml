# Sistema da clínica — um compose, três perfis:
#   docker compose --profile demo up        → tudo local, com Keycloak, Mailpit, Prometheus/Grafana
#   docker compose --profile demo-leve up   → sem Keycloak/observabilidade (≈1,5 GB), login simplificado
#   docker compose --profile prod up -d     → VPS: mesmas imagens, variáveis de produção (.env)
# Valores padrão abaixo são APENAS para demonstração local. Em prod, defina todos no .env.
name: clinica

x-limites-pequenos: &limites-pequenos
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

x-backend: &backend
  <<: *limites-pequenos
  build: ./backend
  image: clinica-backend:${APP_VERSAO:-dev}
  mem_limit: 768m
  cpus: 1.5
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &backend-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PERFIL:-demo}
    DB_URL: jdbc:postgresql://postgres:5432/clinica
    DB_APP_USER: clinica_app
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:-demo-app}
    SPRING_FLYWAY_USER: clinica_migracao
    SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:-demo-migracao}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-demo-redis}
    OIDC_CLIENT_ID: clinica-bff
    OIDC_CLIENT_SECRET: ${KC_CLIENTE_BFF_SEGREDO:-demo-segredo-bff-troque-em-producao}
    OIDC_ISSUER_PUBLICO: ${KC_URL_PUBLICA:-http://localhost:8180}/realms/clinica
    OIDC_ISSUER_INTERNO: ${KC_URL_INTERNA:-http://keycloak:8180}/realms/clinica
    SESSAO_COOKIE_NOME: ${SESSAO_COOKIE_NOME:-__Host-SESSION}
  networks: [interna]

services:
  postgres:
    <<: *limites-pequenos
    image: postgres:18.6-alpine
    profiles: [demo, demo-leve, prod]
    mem_limit: 384m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-demo-postgres}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-demo-app}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-demo-migracao}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-demo-keycloak}
      TZ: UTC
    command: >
      postgres -c shared_buffers=96MB -c effective_cache_size=256MB -c work_mem=4MB
               -c max_connections=60 -c log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]

  redis:
    <<: *limites-pequenos
    image: redis:8.10-alpine
    profiles: [demo, demo-leve, prod]
    mem_limit: 64m
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-demo-redis} --maxmemory 48mb
                   --maxmemory-policy volatile-lru --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-demo-redis}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-demo-redis}
    networks: [interna]

  keycloak:
    <<: *limites-pequenos
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [demo, prod]
    mem_limit: 768m
    command: ${KC_COMANDO:-start-dev --import-realm}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-demo-keycloak}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: ${KC_URL_PUBLICA:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Sem valor: repassa do ambiente/.env só se definida (prod: xforwarded). Vazia, o Keycloak não sobe.
      KC_PROXY_HEADERS:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USUARIO:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_SENHA:-admin}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30"
      # placeholders resolvidos na importação do realm
      KC_CLIENTE_BFF_SEGREDO: ${KC_CLIENTE_BFF_SEGREDO:-demo-segredo-bff-troque-em-producao}
      APP_URL_PUBLICA: ${APP_URL_PUBLICA:-http://localhost:8080}
      KC_DEMO_SENHA: ${KC_DEMO_SENHA:-Demo@2026!}
      # MFA da equipe ligado por padrão; no demo, KC_FLUXO_NAVEGADOR=browser desliga o 2º fator.
      KC_FLUXO_NAVEGADOR: ${KC_FLUXO_NAVEGADOR:-navegador-clinica}
    volumes:
      - ./infra/keycloak/${KC_REALM_DIR:-realm-demo}:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/clinica:/opt/keycloak/themes/clinica:ro
      - ./infra/keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    ports:
      - "${KC_BIND:-127.0.0.1:8180}:8180"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [interna, borda]

  backend:
    <<: *backend
    profiles: [demo, prod]

  backend-leve:
    <<: *backend
    profiles: [demo-leve]
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: demo-leve
    networks:
      interna:
        aliases: [backend]

  web:
    <<: *limites-pequenos
    build: ./frontend
    image: clinica-web:${APP_VERSAO:-dev}
    profiles: [demo, demo-leve, prod]
    mem_limit: 64m
    read_only: true
    tmpfs: ["/data", "/config"]
    environment:
      BACKEND_UPSTREAM: backend:8080
      KC_URL_PUBLICA: ${KC_URL_PUBLICA:-http://localhost:8180}
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    networks: [interna, borda]

  seaweedfs:
    <<: *limites-pequenos
    image: chrislusf/seaweedfs:4.48
    profiles: [demo, demo-leve]
    mem_limit: 192m
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=4
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3-demo.json:/etc/seaweedfs/s3.json:ro
    networks: [interna]

  mailpit:
    <<: *limites-pequenos
    image: axllent/mailpit:v1.32
    profiles: [demo, demo-leve]
    mem_limit: 64m
    ports:
      - "127.0.0.1:8025:8025"
    networks: [interna]

  prometheus:
    <<: *limites-pequenos
    image: prom/prometheus:v3.15.1
    profiles: [demo]
    mem_limit: 256m
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [interna]

  grafana:
    <<: *limites-pequenos
    image: grafana/grafana:13.2.4
    profiles: [demo]
    mem_limit: 192m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:-admin}
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observabilidade/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [interna]

networks:
  interna: {}
  # Em prod o Caddy compartilhado (infra/edge) entra nesta rede para alcançar "web".
  borda:
    name: ${REDE_BORDA:-clinica-borda}

volumes:
  pgdata: {}
  redisdata: {}
  s3data: {}
  promdata: {}
