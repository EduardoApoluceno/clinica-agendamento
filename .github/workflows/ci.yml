name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, testes, Checkstyle, SpotBugs, cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: mvn verify (inclui Testcontainers, ArchUnit e Spring Modulith)
        run: mvn -B verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-relatorios
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
            backend/target/spring-modulith-docs

  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  seguranca-dependencias:
    name: Trivy — dependências e configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Vulnerabilidades em dependências (Maven/npm) e segredos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  imagens:
    name: Imagens Docker + Trivy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        imagem: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.imagem }}
          load: true
          tags: clinica-${{ matrix.imagem }}:ci
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clinica-${{ matrix.imagem }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  zap-baseline:
    name: OWASP ZAP baseline (perfil demo-leve)
    runs-on: ubuntu-latest
    needs: [imagens]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Subir stack demo-leve
        run: docker compose --profile demo-leve up -d --build --wait --wait-timeout 300
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/regras.tsv
          # Fase 0: relatório informativo. Tornar bloqueante quando as telas reais existirem (pendência).
          fail_action: false
          allow_issue_writing: false
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile demo-leve logs --tail 200
